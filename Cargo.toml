[package]
name = "iptop"
version = "0.1.1"
edition = "2021"
description = "A modern, btop-flavoured network bandwidth monitor - iftop reimagined"
license = "GPL-2.0-or-later"

[dependencies]
ratatui = "0.29"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
anyhow = "1"
dns-lookup = "2"
maxminddb = "0.24"
serde = { version = "1", features = ["derive"] }


[profile.release]
lto = true
codegen-units = 1
strip = true
